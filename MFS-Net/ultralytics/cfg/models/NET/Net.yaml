  #m: [0.67, 0.75, 768] 
  #l: [1.00, 1.00, 512] 
  #x: [1.00, 1.25, 512] 

# backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
